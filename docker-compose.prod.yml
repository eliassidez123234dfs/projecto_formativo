services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]
    env_file:
      - .env.prod
    expose:
      - "8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api/
        VITE_TSHIRT3D_URL: /editor/
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  tshirt3d:
    build:
      context: ./microservices/Tshirt3D
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api/orders/
        VITE_MODELS3D_API_URL: /api/models3d/models/
        VITE_FRONTEND_URL: /
    expose:
      - "80"

volumes:
  backend_media:
  backend_static: