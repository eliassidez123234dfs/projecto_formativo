services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: projecto_formativo
      POSTGRES_USER: proyecto_user
      POSTGRES_PASSWORD: proyecto_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto_user -d projecto_formativo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - postgres
      - full

  redis:
    image: redis:7-alpine
    container_name: proyecto_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - redis
      - full

  mongodb:
    image: mongo:7
    container_name: proyecto_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: projecto_formativo
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    profiles:
      - mongodb
      - full

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_users &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/static
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_TYPE: postgres_docker
      DATABASE_URL: postgres://proyecto_user:proyecto_pass@postgres:5432/projecto_formativo
      SESSION_BACKEND: cached_db
      REDIS_URL: redis://redis:6379/0
      USE_MONGODB: "true"
      MONGODB_URI: mongodb://mongodb:27017/projecto_formativo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  backend-sqlite:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_backend_sqlite
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_users &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/static
      - sqlite_data:/app/db
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DB_TYPE: sqlite
      SESSION_BACKEND: django_db
      USE_MONGODB: "false"
    networks:
      - app_network
    profiles:
      - sqlite

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: /api/
    depends_on:
      - backend
    networks:
      - app_network

  tshirt3d:
    build:
      context: ./microservices/Tshirt3D
      dockerfile: Dockerfile
    container_name: proyecto_tshirt3d
    working_dir: /app
    volumes:
      - ./microservices/Tshirt3D:/app
      - /app/node_modules
    ports:
      - '5174:5174'
    env_file:
      - ./microservices/Tshirt3D/.env
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  backend_media:
  backend_static:
  sqlite_data:

networks:
  app_network:
    driver: bridge
