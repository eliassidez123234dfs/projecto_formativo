services:
  postgres:
    image: postgres:16-alpine
    container_name: proyecto_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: projecto_formativo
      POSTGRES_USER: proyecto_user
      POSTGRES_PASSWORD: proyecto_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyecto_user -d projecto_formativo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_users &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/static
    ports:
      - '8000:8000'
    environment:
      SECRET_KEY: django-insecure-dev-key-change-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://proyecto_user:proyecto_pass@postgres:5432/projecto_formativo
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: /api/
    depends_on:
      - backend
    networks:
      - app_network

  tshirt3d:
    build:
      context: ./microservices/Tshirt3D
      dockerfile: Dockerfile
    container_name: proyecto_tshirt3d
    working_dir: /app
    volumes:
      - ./microservices/Tshirt3D:/app
      - /app/node_modules
    ports:
      - '5174:5174'
    env_file:
      - ./microservices/Tshirt3D/.env
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:

networks:
  app_network:
    driver: bridge
