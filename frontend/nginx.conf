# =============================================================================
#  Nginx — Reverse Proxy para RED Estampacion
#  Configuracion de seguridad + rendimiento segun OWASP ASVS v4.0 / NIST SP 800-123
#
#  Seguridad: cabeceras OWASP, bloqueo de dotfiles, server_tokens off
#  Rendimiento: gzip/brotli, cache por tipo de archivo, HTTP/2 ready
# =============================================================================

# Ocultar versiones (OWASP A05:2021 — Security Misconfiguration)
server_tokens off;

# Compresion gzip — reduce ~60-70% el tamaño de respuestas HTTP
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/woff2
    application/font-woff;

server {
    # En produccion con TLS, usar:
    #   listen 443 ssl http2;
    #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #   ssl_protocols TLSv1.3 TLSv1.2;
    #   ssl_prefer_server_ciphers off;
    #   ssl_session_cache shared:SSL:10m;
    #   ssl_session_timeout 1d;
    #   ssl_session_tickets off;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Cabeceras de Seguridad (OWASP A05:2021) ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # HSTS — Solo habilitar con TLS en produccion
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (OWASP A03:2021 — Injection)
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com; "
        "font-src 'self'; "
        "connect-src 'self' http://localhost:8000 https://api.cloudinary.com; "
        "frame-src 'none'; "
        "object-src 'none'; "
        "base-uri 'self'; "
        "form-action 'self' https://sandbox.wompi.co; "
        "frame-ancestors 'self';"
    always;

    # ── Cache: archivos JS/CSS/hash-chunked (Vite genera hashes únicos) ──
    # Estos archivos cambian solo cuando el código fuente cambia.
    # 1 año de cache porque el hash en el nombre invalida la cache automáticamente.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: fuentes web ──
    location ~* \.(?:woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache: imágenes estáticas ──
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA: todas las rutas -> index.html ──
    # Nunca cachear index.html (siempre verificar cambios)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API: proxy a Django Gunicorn ──
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;

        # Nunca cachear respuestas de la API (datos dinámicos)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Media files (imágenes subidas por usuarios) ──
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache corto para media (las URLs son únicas por hash de Cloudinary)
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Static files de Django ──
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;

        # Los archivos estáticos de Django ya tienen hash en el nombre
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Admin panel ──
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No cachear panel de admin
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Bloquear archivos ocultos (.env, .git, etc.) ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
