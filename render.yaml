# Render Blueprint - Despliegue automatizado
# https://render.com/docs/blueprint-spec
services:
  # ─── BACKEND DJANGO ───
  - type: web
    name: red-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install -r requirements.txt --quiet
      python manage.py collectstatic --noinput --clear
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --config gunicorn.conf.py
    healthCheckPath: /api/health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DB_TYPE
        value: neon
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_BACKEND
        value: "smtp"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: USE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: "projecto_formativo"
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false
      - key: WOMPI_WEBHOOK_SECRET
        sync: false
      - key: WOMPI_API_URL
        value: "https://sandbox.wompi.co/v1"
      - key: WOMPI_CURRENCY
        value: "COP"
      - key: WOMPI_REDIRECT_URL
        sync: false
      - key: SESSION_BACKEND
        value: "cached_db"
      - key: REDIS_URL
        sync: false
      - key: LOG_OUTPUT
        value: "console"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.12"
